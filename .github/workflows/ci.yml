name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'
    - name: Format
      run: test -z "$(find cmd internal pkg -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
    - name: Build
      run: make build
    - name: Test
      run: make test
    - name: Race test
      run: GOTOOLCHAIN=local go test -race ./...
    - name: Lint
      run: make lint
    - name: Vet
      run: GOTOOLCHAIN=local go vet ./...
    - name: Cross compile
      run: make cross-build
    - uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: dist/
        if-no-files-found: error

  cloudflare:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: deploy/cloudflare/package-lock.json
    - name: Install
      working-directory: deploy/cloudflare
      run: npm ci
    - name: Check generated Worker types
      working-directory: deploy/cloudflare
      run: npx wrangler types --check worker-configuration.d.ts
    - name: Typecheck
      working-directory: deploy/cloudflare
      run: npx tsc --noEmit
    - name: Wrangler dry run
      working-directory: deploy/cloudflare
      run: npx wrangler deploy --dry-run
